# Domain promotion approvals for the verified tiers.
#
# Every domain in classify.verified_news / classify.verified_primary must have
# an entry here. A NEW domain is promoted only after:
#   1. at least one full weekly monitor cycle in classify.pending_classify, and
#   2. an approval entry below naming the approver, date, and rationale.
# The human-approval side is the maintainer's responsibility; the test suite
# (scripts/tests/test_domains.py) enforces that the entry EXISTS.
#
# Grandfather policy: domains dated 2026-09-26 were already in the verified
# corpus before the quarantine rule existed. They are attributed to
# "grandfather-policy", not to a person, because they were not individually
# reviewed under the current approval process. New domains after this date
# require a named human approver.
