# Flock-Off maintenance pipeline configuration.
#
# This file is the single source of truth for every tunable in the
# maintenance scripts (scripts/source_keys.py, scripts/source_fingerprints.py,
# scripts/classify_sources.py, scripts/weekly_monitor.py). Change behavior
# here, not in code. Loaded and validated by scripts/flockoff_config.py.
#
# Conventions:
# - config_version: bump when the schema changes; the loader fails fast on
#   mismatch so a stale config can never silently drive new code.
# - paths.* are relative to the repository root.
# - urls.* are the remote endpoints the weekly monitor reads.

config_version: 1

paths:
  data: data/agencies.json
  fingerprints: data/source_fingerprints.json
  classification: data/source_classification.json

urls:
  dataset: https://raw.githubusercontent.com/PaulinoTech1/Flock-Off/main/data/agencies.json
  fingerprints: https://raw.githubusercontent.com/PaulinoTech1/Flock-Off/main/data/source_fingerprints.json
  finding_flock_tracker: https://www.findingflock.com/learn/flock-contract-cancellations
  atlas_csv: https://www.atlasofsurveillance.org/download.csv?vendor=Flock+Safety

# Polite, honest fetching. One shared identity for every script that touches
# someone else's server. Never evade bot protection: blocked pages are
# recorded as "blocked" and excluded, not retried through disguises.
fetch:
  user_agent: "Flock-Off/1.0 (+https://flock-off.vercel.app) citation-audit"
  delay_seconds: 1.5
  timeout_seconds: 12
  max_bytes: 300000

# Layer 1: canonical URL normalization for stable source_key values.
dedup:
  host_prefixes:
    - www.
    - m.
    - amp.
  tracking_params:
    - fbclid
    - gclid
    - gclsrc
    - msclkid
    - mc_cid
    - mc_eid
    - _hsenc
    - _hsmi
    - igshid
    - yclid
    - srsltid
    - vero_conv
    - vero_id
  tracking_prefixes:
    - utm_
    - pk_
    - piwik_
    - matomo_

# Layers 2+3: content fingerprints (simhash over word 5-shingles).
fingerprints:
  min_text_len: 200       # below this the fingerprint is "thin": excluded
  pair_min_len: 800       # below this: excluded from simhash pairing
  near_dup_distance: 3    # hamming distance (of 64) at or below: near-duplicate
  update_distance: 8      # hamming distance at or above: material rewrite
  max_age_days: 60        # refresh entries older than this

# Weekly monitor windows and pacing.
monitor:
  renewal_window_days: 90
  stale_days: 180
  update_probe_sample: 20   # citations re-fetched per weekly run (rotating)
  update_probe_delay: 1.5   # seconds between probe fetches

