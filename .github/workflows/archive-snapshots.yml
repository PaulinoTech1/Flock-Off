name: Source snapshot archiver

# CHANGELOG
# 2026-10-05 (v4): Free-tier-safe rework. Vercel Blob free tier caps advanced
#   operations (list/copy) at 2,000/month. The old "Verify blob uploads" step
#   burned 2 list calls per run (~1,440/month from the hourly backfill cron
#   alone), which got the store suspended for 30 days (HTTP 403
#   store_suspended, starting 2026-10-05 ~17:08 EDT). Changes:
#   - REMOVED both blob list calls. Upload verification now uses each batch's
#     own "Snapshot summary:" accounting line. Zero blob API calls per run.
#   - FIX 2026-10-07: batch step runs `fingerprints backfill-archive`
#     (targets sources missing an archive file) instead of `refresh`
#     (re-fetches only stale ok sources), un-stalling the bulk backfill
#   - ADDED "Persist fingerprint updates": commits data/source_fingerprints.json
#     back to main so quarantine/retry_after and snapshot_path survive the
#     runner. Previously these died with the runner, so every batch
#     reprocessed the same sources instead of advancing.
#   - Honest failure signal: if uploads were attempted but none succeeded,
#     the run now FAILS (fixes the false-green where SUCCESS printed with
#     0 uploads). Partial success (some uploaded) still passes with a warning.
#   - Job summary carries attempted/uploaded/failed for the backfill cron,
#     which reads it via the GitHub API (no blob calls).
# 2026-10-06 (v4 pre-push fixes): commit-before-rebase ordering in the
#   persist step (rebase refuses a dirty index), explicit
#   permissions: contents: write, and removal of the snapshot_exists()
#   LIST pre-check in scripts/blob_archive.py (deterministic PUT paths
#   overwrite safely; one LIST per snapshot was the remaining
#   advanced-operation burn).
# 2026-10-04 (v3): Fix unconditional failure in "Verify blob uploads".
#   Removed stray `exit 1` / `fi` after the final COUNT check, which made
#   the step fail on every run even when uploads succeeded (18 straight
#   red runs; the backfill itself was healthy and uploading).
# 2026-10-04 (v2): Install from scripts/requirements.txt (adds curl-cffi)
#   so the fingerprint refresh uses the Chrome-TLS-impersonation fetch
#   client instead of the stdlib fallback. Non-ok sources are quarantined
#   per config fingerprints.quarantine_days so each batch advances.
# 2026-10-04 (v1): Initial workflow (weekly Monday 12:48 UTC + manual).
#
on:
  schedule:
    # Mondays 12:48 UTC = 08:48 EDT (matches the weekly monitor)
    - cron: "48 12 * * 1"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Sources per batch (default 25)"
        required: false
        default: "25"
      batches:
        description: "Number of batches to run (blank for 1)"
        required: false
        default: ""
      dry_run:
        description: "Validate only, do not upload snapshots"
        required: false
        type: boolean
        default: false
      maintenance:
        description: "Maintenance task: delete-dry-run or delete-confirm (deletes example.com test pollution)"
        required: false
        default:
      keys:
        description: "Comma-separated source_keys to archive (skips batch selection)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate config
        run: |
          python3 scripts/flockoff.py config validate

      - name: Run test suite
        run: python3 scripts/flockoff.py test

      - name: Maintenance task
        if: ${{ inputs.maintenance != '' }}
        env:
          ARCHIVE_BLOB_READ_WRITE_TOKEN: ${{ secrets.ARCHIVE_BLOB_READ_WRITE_TOKEN }}
        run: |
          # Maintenance mode: blob cleanup tasks. Does not run batches.
          TASK="${{ inputs.maintenance }}"
          echo "=== Maintenance task: $TASK ==="
          if [ "$TASK" = "delete-dry-run" ]; then
            python3 scripts/blob_archive.py delete \
              --prefix "example.com" \
              --reason "test pollution cleanup (maintenance dry-run)" \
              --dry-run
          elif [ "$TASK" = "delete-confirm" ]; then
            python3 scripts/blob_archive.py delete \
              --prefix "example.com" \
              --reason "test pollution cleanup (maintenance confirmed)" \
              --yes
          else
            echo "Unknown maintenance task: $TASK" >&2
            echo "Valid: delete-dry-run, delete-confirm" >&2
            exit 1
          fi
          echo "=== Maintenance complete ==="

      - name: Backfill-archive fingerprints and snapshot archives
        if: ${{ inputs.maintenance == '' }}
        env:
          ARCHIVE_BLOB_READ_WRITE_TOKEN: ${{ secrets.ARCHIVE_BLOB_READ_WRITE_TOKEN }}
        run: |
          # Batch mode: run N batches of M sources each.
          # Non-ok sources (blocked/error/non_html/thin) are quarantined
          # (config fingerprints.quarantine_days), so each batch advances
          # through the next M sources instead of re-fetching the same
          # dead sources every run. Failed batches are
          # recorded and reported at the end without stopping the run.
          # Each batch's "Snapshot summary:" line is saved for the verify
          # step (batch-local accounting; zero blob API calls).
          BATCH_SIZE="${{ inputs.max_sources }}"
          BATCH_SIZE=${BATCH_SIZE:-25}
          NUM_BATCHES="${{ inputs.batches }}"
          NUM_BATCHES=${NUM_BATCHES:-1}
          # Scheduled runs default to a single batch of 25.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            NUM_BATCHES=1
          fi
          echo "Running $NUM_BATCHES batch(es) of $BATCH_SIZE sources"
          : > /tmp/snap_summary.txt
          FAILED_BATCHES=""
          set +e
          for i in $(seq 1 "$NUM_BATCHES"); do
            echo ""
            echo "=============== BATCH $i/$NUM_BATCHES ==============="
            if [ -n "${{ inputs.keys }}" ] && [ "$i" -eq 1 ]; then
              echo "Using explicit source keys (skipping batch selection)"
              python3 scripts/flockoff.py fingerprints refresh --keys "${{ inputs.keys }}" > /tmp/batch_$i.log 2>&1
            else
              python3 scripts/flockoff.py fingerprints backfill-archive --max "$BATCH_SIZE" > /tmp/batch_$i.log 2>&1
            fi
            BATCH_EXIT=$?
            cat /tmp/batch_$i.log
            grep "Snapshot summary:" /tmp/batch_$i.log | tail -1 >> /tmp/snap_summary.txt || true
            if [ "$BATCH_EXIT" -ne 0 ]; then
              echo "BATCH $i: FAILED (exit $BATCH_EXIT)"
              FAILED_BATCHES="$FAILED_BATCHES $i"
            else
              echo "BATCH $i: SUCCESS"
            fi
          done
          set -e
          echo ""
          echo "=============== BATCH SUMMARY ==============="
          echo "Completed $NUM_BATCHES batch(es) of $BATCH_SIZE sources"
          if [ -z "$FAILED_BATCHES" ]; then
            echo "All batches succeeded."
          else
            echo "FAILED batches:$FAILED_BATCHES"
            exit 1
          fi
        # Note: a hard fingerprint crash fails the batch (non-zero exit).
        # Blob upload outcomes are judged by the verify step below using
        # batch-local accounting, honestly: attempted-but-zero-uploaded fails.

      - name: Report snapshot status
        if: always()
        run: |
          echo "=== Checking for blob warnings in logs ==="
          echo "If no blob_archive WARNING lines appeared above,"
          echo "snapshots uploaded successfully."

      - name: Report per-source hit/miss
        if: always()
        run: |
          echo "=== Per-source hit/miss report ==="
          echo "1=hit (archived), 0=miss (blocked/error/thin)"
          echo ""
          if [ -f /tmp/hitmiss.json ]; then
            python3 -c "
          import json
          with open('/tmp/hitmiss.json') as f:
              results = json.load(f)
          hits = sum(1 for r in results if r['hit'] == 1)
          misses = len(results) - hits
          print(f'Total: {len(results)}, Hits: {hits}, Misses: {misses}')
          print('')
          for r in results:
              status = 'HIT ' if r['hit'] == 1 else 'MISS'
              print(f\"[{status}] {r['fetch_status']:8} {r['source_key'][:70]}\")
          print('')
          # Blocked sources list for manual scraping
          blocked = [r for r in results if r['fetch_status'] == 'blocked']
          if blocked:
              print(f'=== BLOCKED SOURCES ({len(blocked)}) ===')
              for r in blocked:
                  print(r['source_key'])
              # Save to file for download
              with open('/tmp/blocked_sources.txt', 'w') as f:
                  for r in blocked:
                      f.write(r['source_key'] + '\n')
              print('')
              print('Blocked list saved to /tmp/blocked_sources.txt')
          "
          else
            echo "No hit/miss report found (/tmp/hitmiss.json missing)"
            echo "This happens when using --keys mode or if refresh did not run"
          fi

      - name: Verify uploads from batch accounting
        # Free-tier-safe replacement for the old "Verify blob uploads" step,
        # which burned 2 blob LIST calls (advanced operations) per run and
        # exhausted the 2,000/month free-tier cap. This step makes ZERO blob
        # API calls: it sums the per-batch "Snapshot summary:" lines the
        # refresh script already prints.
        if: ${{ always() && inputs.maintenance == '' }}
        run: |
          echo "=== Snapshot accounting (no blob API calls) ==="
          python3 - <<'EOF'
          import re, sys
          attempted = uploaded = failed = 0
          try:
              with open('/tmp/snap_summary.txt') as f:
                  for line in f:
                      m = re.search(r'attempted=(\d+)\s+uploaded=(\d+)\s+failed=(\d+)', line)
                      if m:
                          attempted += int(m.group(1))
                          uploaded += int(m.group(2))
                          failed += int(m.group(3))
          except FileNotFoundError:
              pass
          print(f"attempted={attempted} uploaded={uploaded} failed={failed}")
          with open('/tmp/snap_totals.txt', 'w') as f:
              f.write(f"{attempted} {uploaded} {failed}\n")
          # Job summary for the backfill cron (read via GitHub API).
          with open('/tmp/snap_summary.md', 'w') as f:
              f.write("### Snapshot archiver result\n")
              f.write(f"- attempted: {attempted}\n- uploaded: {uploaded}\n- failed: {failed}\n")
          if attempted > 0 and uploaded == 0:
              print("E_SNAP_FAIL: uploads were attempted but none succeeded.", file=sys.stderr)
              print("Failing honestly instead of printing SUCCESS on 0 uploads.", file=sys.stderr)
              sys.exit(1)
          if failed > 0:
              print(f"WARNING: {failed} snapshot(s) failed to upload (partial success).")
          if attempted == 0:
              print("No uploads attempted this run (sources blocked/thin/quarantined).")
          EOF
          cat /tmp/snap_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist fingerprint updates
        # Commits quarantine/retry_after and snapshot_path updates back to
        # main so the next batch advances instead of reprocessing the same
        # sources. Previously these updates died with the runner.
        if: ${{ always() && inputs.maintenance == '' }}
        run: |
          git config user.name "flock-off-archiver"
          git config user.email "flock-off-archiver@users.noreply.github.com"
          git fetch origin main
          git add data/source_fingerprints.json data/fingerprint_reviews.json
          if git diff --cached --quiet; then
            echo "No fingerprint changes to persist."
            exit 0
          fi
          # Commit BEFORE rebasing: git rebase refuses to run with staged
          # changes, so the old add-then-rebase order always failed here.
          git commit -m "Archive snapshots: fingerprint updates (pre-rebase)"
          if ! git rebase origin/main; then
            git rebase --abort
            echo "WARNING: rebase onto origin/main failed, skipping persist (next run will retry)."
            exit 0
          fi
          ARCHIVED_TOTAL=$(python3 -c "
          import json
          fps = json.load(open('data/source_fingerprints.json'))
          print(sum(1 for r in fps.values() if r.get('snapshot_path')))
          ")
          echo "Total sources archived (snapshot_path set): $ARCHIVED_TOTAL"
          git commit --amend -m "Archive snapshots: update fingerprints $(date -u +%Y-%m-%dT%H:%M:%SZ) (archived_total=$ARCHIVED_TOTAL)"
          git push origin HEAD:main
          echo "Fingerprint updates persisted."
