name: Error capture
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 scripts/flockoff.py config validate 2>&1 || echo "EXIT CODE: $?"
          echo "--- trying direct python ---"
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from flockoff_config import load_config; print(load_config()['_config_path'])" 2>&1 || echo "EXIT CODE: $?"
