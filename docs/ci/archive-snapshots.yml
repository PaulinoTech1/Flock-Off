name: Source snapshot archiver

# Archives JSON snapshots of fetched sources to the Vercel Blob store.
# Runs weekly alongside the monitor; can also be triggered manually.
#
# Required repository secret:
#   ARCHIVE_BLOB_READ_WRITE_TOKEN: Read-Write token for the source-archive
#     blob store (Vercel dashboard > Storage > your archive store).
#
# NOTE: This file cannot be pushed via the Git Data API (GitHub blocks
# .github/workflows/** in git/trees). Add it manually via the GitHub web UI:
# repo > Actions > New workflow > set up a workflow yourself.

on:
  schedule:
    # Mondays 12:48 UTC = 08:48 EDT (matches the weekly monitor)
    - cron: "48 12 * * 1"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Sources per batch (default 25)"
        required: false
        default: "25"
      batches:
        description: "Number of batches to run (blank for 1)"
        required: false
        default: ""
      dry_run:
        description: "Validate only, do not upload snapshots"
        required: false
        type: boolean
        default: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ARCHIVE_BLOB_READ_WRITE_TOKEN: ${{ secrets.ARCHIVE_BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate config
        run: |
          python3 scripts/flockoff.py config validate

      - name: Run test suite
        run: python3 scripts/flockoff.py test

      - name: Refresh fingerprints and archive snapshots
        run: |
          # Batch mode: run N batches of M sources each.
          # Fresh fingerprints are skipped, so each batch advances
          # through the next M stale sources. Failed batches are
          # recorded and reported at the end without stopping the run.
          BATCH_SIZE="${{ inputs.max_sources }}"
          BATCH_SIZE=${BATCH_SIZE:-25}
          NUM_BATCHES="${{ inputs.batches }}"
          NUM_BATCHES=${NUM_BATCHES:-1}
          # Scheduled runs default to a single batch of 25.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            NUM_BATCHES=1
          fi
          echo "Running $NUM_BATCHES batch(es) of $BATCH_SIZE sources"
          FAILED_BATCHES=""
          for i in $(seq 1 "$NUM_BATCHES"); do
            echo ""
            echo "=============== BATCH $i/$NUM_BATCHES ==============="
            if python3 scripts/flockoff.py fingerprints refresh --max "$BATCH_SIZE"; then
              echo "BATCH $i: SUCCESS"
            else
              echo "BATCH $i: FAILED"
              FAILED_BATCHES="$FAILED_BATCHES $i"
            fi
          done
          echo ""
          echo "=============== BATCH SUMMARY ==============="
          echo "Completed $NUM_BATCHES batch(es) of $BATCH_SIZE sources"
          if [ -z "$FAILED_BATCHES" ]; then
            echo "All batches succeeded."
          else
            echo "FAILED batches:$FAILED_BATCHES"
            exit 1
          fi
        # Fail-open: blob warnings do not fail the job. Only a hard
        # fingerprint crash fails. Check the logs for
        # "blob_archive: WARNING" lines to confirm uploads.

      - name: Report snapshot status
        if: always()
        run: |
          echo "=== Checking for blob warnings in logs ==="
          echo "If no blob_archive WARNING lines appeared above,"
          echo "snapshots uploaded successfully."

      - name: Verify blob uploads
        if: always()
        run: |
          echo "=== Snapshots archived today ==="
          TODAY=$(date -u +%Y-%m-%d)
          # E_VERIFY_FAIL: blob listing errors are fatal, not zero.
          # A failed listing must never be reported as "0 snapshots".
          LIST_OUT=$(python3 scripts/blob_archive.py list --date "$TODAY" 2>&1)
          LIST_EXIT=$?
          if [ $LIST_EXIT -ne 0 ]; then
            echo "E_VERIFY_FAIL: blob list command failed (exit $LIST_EXIT)"
            echo "$LIST_OUT"
            exit 1
          fi
          COUNT=$(echo "$LIST_OUT" | grep -c "^snapshots/" || true)
          echo "Snapshots for $TODAY: $COUNT"
          echo ""
          echo "=== Sample paths (first 10) ==="
          echo "$LIST_OUT" | grep "^snapshots/" | head -10
          echo ""
          echo "=== Total snapshots in store ==="
          TOTAL_OUT=$(python3 scripts/blob_archive.py list 2>&1)
          TOTAL_EXIT=$?
          if [ $TOTAL_EXIT -ne 0 ]; then
            echo "E_VERIFY_FAIL: total blob list command failed (exit $TOTAL_EXIT)"
            echo "$TOTAL_OUT"
            exit 1
          fi
          # Note: list defaults to 100 results without pagination.
          # TOTAL is a floor, not an exact count, when it hits 100.
          TOTAL=$(echo "$TOTAL_OUT" | grep -c "^snapshots/" || true)
          echo "Total snapshots: $TOTAL"
          if [ "$TOTAL" -eq 100 ]; then
            echo "WARNING: hit 100-result list cap; actual total may be higher."
          fi
          echo ""
          if [ "$COUNT" -eq 0 ]; then
            echo "E_VERIFY_FAIL: zero snapshots listed for today. If the refresh"
            echo "reported uploads, the listing and upload are inconsistent."
            echo "This is a failure, not a clean zero."
            exit 1
          fi
